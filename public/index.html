<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatPat Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.7;
            padding: 20px;
        }

        .container {
            max-width: 720px;
            margin: 40px auto;
            background: #2a2a2a;
            padding: 50px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid #3a3a3a;
        }

        h2 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 24px;
            border-left: 4px solid #4a90e2;
            padding-left: 15px;
        }

        h3 {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 16px;
            border-left: 4px solid #4a90e2;
            padding-left: 15px;
        }

        p {
            color: #d0d0d0;
        }

        #messages {
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            height: 320px;
            overflow-y: auto;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            background: #1f1f1f;
            color: #d0d0d0;
        }

        .msg {
            margin: 0.35rem 0;
            word-wrap: break-word;
        }

        .sender {
            font-weight: bold;
            color: #4a90e2;
        }

        .system {
            color: #888;
            font-style: italic;
            font-size: 0.9em;
            margin: 0.35rem 0;
        }

        input {
            padding: 0.65rem 0.8rem;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            background: #1f1f1f;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
        }

        input::placeholder {
            color: #888;
        }

        input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        button {
            padding: 0.65rem 1.6rem;
            border: none;
            border-radius: 6px;
            background: #4a90e2;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #357abd;
        }

        #joinPanel input {
            margin-bottom: 0.75rem;
            width: 100%;
            display: block;
        }

        #msgInput {
            width: calc(100% - 120px);
        }

        .footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 20px 0 0 0;
            margin-top: 40px;
            border-top: 1px solid #3a3a3a;
            color: #fff;
            font-size: 13px;
        }

        .footer-meta a {
            color: #4a90e2;
            text-decoration: none;
        }

        .footer-meta a:hover {
            text-decoration: underline;
        }

        #conn {
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
                margin: 10px auto;
            }

            h2 {
                font-size: 1.3rem;
            }

            #msgInput {
                width: calc(100% - 105px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Влез в чат стая</h2>

        <div id="joinPanel">
            <input id="roomInput" placeholder="Име на канал (напр. general)" autocomplete="off">
            <input id="nameInput" placeholder="Твоето име" autocomplete="off">
            <button id="joinBtn">Влез</button>
        </div>

        <div id="chatPanel" style="display:none">
            <h3>Стая: <span id="roomTitle"></span></h3>
            <div id="messages"></div>
            <input id="msgInput" placeholder="Напиши съобщение..." autocomplete="off">
            <button id="sendBtn">Изпрати</button>
        </div>

        <footer class="footer">
            <div class="footer-meta">
                <p id="footer-year"></p>
                <a href="privacy_policy.html" target="_blank">Privacy Policy</a>
                <span id="conn"></span>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const date_updated = document.getElementById("footer-year");
            if (date_updated) { // Safety check to prevent errors if the ID is missing
                const currentYear = new Date().getFullYear();
                date_updated.textContent = `Chat-Pat Chat © ${currentYear}`;
            }
        });
    </script>

    <script>
        let ws = null;
        let userName = null;
        let currentRoom = null;

        const $ = (id) => document.getElementById(id);

        $('joinBtn').addEventListener('click', joinRoom);

        function joinRoom() {
            currentRoom = $('roomInput').value.trim();
            userName = $('nameInput').value.trim() || 'Анонимен';

            if (!currentRoom) {
                alert('Въведи име на канал!');
                return;
            }

            $('joinPanel').style.display = 'none';
            $('chatPanel').style.display = 'block';
            $('roomTitle').textContent = currentRoom;

            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const wsUrl = `${proto}://${location.host}/room/${encodeURIComponent(currentRoom)}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', name: userName }));
            };

            ws.onmessage = (e) => {
                let data;
                try { data = JSON.parse(e.data); } catch { return; }

                if (data.type === 'history') {
                    data.messages.forEach(addMessage);
                } else if (data.type === 'message') {
                    addMessage(data);
                } else if (data.type === 'system') {
                    addSystem(data.text);
                }
            };

            ws.onclose = () => {
                addSystem('Връзката е прекъсната. Презареди страницата, за да се свържеш отново.');
            };

            ws.onerror = () => {
                addSystem('Възникна грешка във връзката.');
            };
        }

        function addMessage(m) {
            const div = document.createElement('div');
            div.className = 'msg';

            const sender = document.createElement('span');
            sender.className = 'sender';
            sender.textContent = m.sender + ': ';

            div.appendChild(sender);
            div.appendChild(document.createTextNode(m.text));

            $('messages').appendChild(div);
            $('messages').scrollTop = $('messages').scrollHeight;
        }

        function addSystem(text) {
            const div = document.createElement('div');
            div.className = 'system';
            div.textContent = text;
            $('messages').appendChild(div);
            $('messages').scrollTop = $('messages').scrollHeight;
        }

        function sendMessage() {
            const text = $('msgInput').value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'message',
                sender: userName,
                text: text
            }));

            $('msgInput').value = '';
            $('msgInput').focus();
        }

        $('sendBtn').addEventListener('click', sendMessage);

        $('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Enter и в полетата за вход
        $('roomInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') $('nameInput').focus();
        });
        $('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });
    </script>
</body>

</html>
