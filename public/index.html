<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Чат</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
        }

        h2,
        h3 {
            margin-top: 0;
        }

        #messages {
            border: 1px solid #ccc;
            border-radius: 6px;
            height: 320px;
            overflow-y: auto;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            background: #fafafa;
        }

        .msg {
            margin: 0.35rem 0;
            word-wrap: break-word;
        }

        .sender {
            font-weight: bold;
            color: #0066cc;
        }

        .system {
            color: #888;
            font-style: italic;
            font-size: 0.9em;
            margin: 0.35rem 0;
        }

        input {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background: #0066cc;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #0055aa;
        }

        #joinPanel input {
            margin-bottom: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        #msgInput {
            width: calc(100% - 120px);
        }
    </style>
</head>

<body>
    <h2>Влез в чат стая</h2>

    <div id="joinPanel">
        <input id="roomInput" placeholder="Име на канал (напр. general)" autocomplete="off">
        <input id="nameInput" placeholder="Твоето име" autocomplete="off">
        <button id="joinBtn">Влез</button>
    </div>

    <div id="chatPanel" style="display:none">
        <h3>Стая: <span id="roomTitle"></span></h3>
        <div id="messages"></div>
        <input id="msgInput" placeholder="Напиши съобщение..." autocomplete="off">
        <button id="sendBtn">Изпрати</button>
    </div>

    <script>
        let ws = null;
        let userName = null;
        let currentRoom = null;

        const $ = (id) => document.getElementById(id);

        $('joinBtn').addEventListener('click', joinRoom);

        function joinRoom() {
            currentRoom = $('roomInput').value.trim();
            userName = $('nameInput').value.trim() || 'Анонимен';

            if (!currentRoom) {
                alert('Въведи име на канал!');
                return;
            }

            $('joinPanel').style.display = 'none';
            $('chatPanel').style.display = 'block';
            $('roomTitle').textContent = currentRoom;

            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const wsUrl = `${proto}://${location.host}/room/${encodeURIComponent(currentRoom)}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', name: userName }));
            };

            ws.onmessage = (e) => {
                let data;
                try { data = JSON.parse(e.data); } catch { return; }

                if (data.type === 'history') {
                    data.messages.forEach(addMessage);
                } else if (data.type === 'message') {
                    addMessage(data);
                } else if (data.type === 'system') {
                    addSystem(data.text);
                }
            };

            ws.onclose = () => {
                addSystem('Връзката е прекъсната. Презареди страницата, за да се свържеш отново.');
            };

            ws.onerror = () => {
                addSystem('Възникна грешка във връзката.');
            };
        }

        function addMessage(m) {
            const div = document.createElement('div');
            div.className = 'msg';

            const sender = document.createElement('span');
            sender.className = 'sender';
            sender.textContent = m.sender + ': ';

            div.appendChild(sender);
            div.appendChild(document.createTextNode(m.text));

            $('messages').appendChild(div);
            $('messages').scrollTop = $('messages').scrollHeight;
        }

        function addSystem(text) {
            const div = document.createElement('div');
            div.className = 'system';
            div.textContent = text;
            $('messages').appendChild(div);
            $('messages').scrollTop = $('messages').scrollHeight;
        }

        function sendMessage() {
            const text = $('msgInput').value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'message',
                sender: userName,
                text: text
            }));

            $('msgInput').value = '';
            $('msgInput').focus();
        }

        $('sendBtn').addEventListener('click', sendMessage);

        $('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Enter и в полетата за вход
        $('roomInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') $('nameInput').focus();
        });
        $('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });
    </script>
</body>

</html>
